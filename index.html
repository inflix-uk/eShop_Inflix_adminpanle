<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var href = localStorage.getItem("favicon");
          if (!href) return;
          ["icon", "shortcut icon", "apple-touch-icon"].forEach(function (rel) {
            var l = document.createElement("link");
            l.rel = rel;
            l.href = href;
            document.head.appendChild(l);
          });
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Inflix Admin Panel</title>
    <meta
      name="description"
      content="High-quality refurbished and new mobile phones at competitive prices. Shop now on eBay, Amazon, Back Market, or our own site!"
      data-rh="true"
    />
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
