<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // A copy of this page kept by the browser from before a deploy names
      // script files that no longer exist, so nothing would render until a
      // manual refresh. Fetch the current page instead, once a minute at most.
      (function () {
        var KEY = "eshop:shellReloadAt";
        window.addEventListener(
          "error",
          function (event) {
            var el = event.target;
            if (!el || el.tagName !== "SCRIPT" || el.type !== "module") return;
            if (String(el.src || "").indexOf("/assets/") === -1) return;
            if (navigator.onLine === false) return;
            try {
              var last = Number(sessionStorage.getItem(KEY)) || 0;
              if (Date.now() - last < 60000) return;
              sessionStorage.setItem(KEY, String(Date.now()));
            } catch (e) {
              return;
            }
            window.location.reload();
          },
          true
        );
      })();
    </script>
    <script>
      (function () {
        try {
          var href = localStorage.getItem("favicon");
          if (!href) return;
          ["icon", "shortcut icon", "apple-touch-icon"].forEach(function (rel) {
            var l = document.createElement("link");
            l.rel = rel;
            l.href = href;
            document.head.appendChild(l);
          });
        } catch (e) {}
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Inflix Admin Panel</title>
    <meta
      name="description"
      content="High-quality refurbished and new mobile phones at competitive prices. Shop now on eBay, Amazon, Back Market, or our own site!"
      data-rh="true"
    />
    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
